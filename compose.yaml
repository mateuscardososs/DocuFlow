services:
  redis:
    image: redis:8.2.10-alpine3.22
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - docuflow_local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuflow}
      POSTGRES_USER: ${POSTGRES_USER:-docuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuflow_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - docuflow_local_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  docuflow_local_redis_data:
    name: docuflow_local_redis_data
  docuflow_local_postgres_data:
    name: docuflow_local_postgres_data
