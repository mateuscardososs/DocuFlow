services:
  e2e-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["python", "-m", "uvicorn", "backend.tests.integration.browser_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DOCUFLOW_TEST_CONTAINER_DATABASE_URL:?Set the dedicated test database URL}
      TEST_DATABASE_URL: ${DOCUFLOW_TEST_CONTAINER_DATABASE_URL:?Set the dedicated test database URL}
      REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      TEST_REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      ERP_REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      DOCUFLOW_QUEUE_NAME: ${TEST_RQ_QUEUE_NAME:?Set a unique test queue}
      TEST_RQ_QUEUE_NAME: ${TEST_RQ_QUEUE_NAME:?Set a unique test queue}
      DOCUFLOW_ERP_QUEUE_NAME: ${TEST_ERP_RQ_QUEUE_NAME:?Set a unique ERP test queue}
      TEST_ERP_RQ_QUEUE_NAME: ${TEST_ERP_RQ_QUEUE_NAME:?Set a unique ERP test queue}
      DOCUFLOW_FRONTEND_ORIGIN: ${DOCUFLOW_FRONTEND_ORIGIN:?Set the browser test frontend origin}
      DOCUMENT_STORAGE_DIR: /var/lib/docuflow/documents
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a test-only JWT key}
    ports:
      - "127.0.0.1:${API_PORT:?Set the browser test API port}:8000"
    volumes:
      - ${DOCUFLOW_TEST_DOCUMENT_STORAGE_DIR:?Set the isolated test storage directory}:/var/lib/docuflow/documents
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.compose_healthcheck", "api"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  e2e-document-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: document-worker
    command:
      - rq
      - worker
      - --url
      - ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      - --name
      - docuflow-browser-${DOCUFLOW_TEST_RUN_ID:?Set a unique run ID}-document
      - ${TEST_RQ_QUEUE_NAME:?Set a unique test queue}
    environment:
      DATABASE_URL: ${DOCUFLOW_TEST_CONTAINER_DATABASE_URL:?Set the dedicated test database URL}
      TEST_DATABASE_URL: ${DOCUFLOW_TEST_CONTAINER_DATABASE_URL:?Set the dedicated test database URL}
      REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      TEST_REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      TEST_RQ_QUEUE_NAME: ${TEST_RQ_QUEUE_NAME:?Set a unique test queue}
      DOCUFLOW_TEST_ORDER_REFERENCE: ${DOCUFLOW_TEST_ORDER_REFERENCE:?Set a unique test order reference}
      DOCUMENT_STORAGE_DIR: /var/lib/docuflow/documents
      DOCUFLOW_OCR_LANGUAGE: por+eng
      DOCUFLOW_RQ_WORKER_NAME: docuflow-browser-${DOCUFLOW_TEST_RUN_ID:?Set a unique run ID}-document
    volumes:
      - ${DOCUFLOW_TEST_DOCUMENT_STORAGE_DIR:?Set the isolated test storage directory}:/var/lib/docuflow/documents
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.compose_healthcheck", "document-worker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  e2e-erp-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
      - rq
      - worker
      - --url
      - ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      - --name
      - docuflow-browser-${DOCUFLOW_TEST_RUN_ID:?Set a unique run ID}-erp
      - ${TEST_ERP_RQ_QUEUE_NAME:?Set a unique ERP test queue}
    environment:
      DATABASE_URL: ${DOCUFLOW_TEST_CONTAINER_DATABASE_URL:?Set the dedicated test database URL}
      REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      ERP_REDIS_URL: ${DOCUFLOW_TEST_CONTAINER_REDIS_URL:?Set the test Redis URL}
      DOCUFLOW_ERP_QUEUE_NAME: ${TEST_ERP_RQ_QUEUE_NAME:?Set a unique ERP test queue}
      DOCUFLOW_RQ_WORKER_NAME: docuflow-browser-${DOCUFLOW_TEST_RUN_ID:?Set a unique run ID}-erp
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.compose_healthcheck", "erp-worker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  e2e-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the browser test API URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?Set the browser test frontend port}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:
    external: true
    name: ${DOCUFLOW_E2E_DOCKER_NETWORK:-docuflow_default}
